# Local development dependencies for CourseLit.
# Usage:
#   docker compose up -d
#   docker compose down        # keeps data
#   docker compose down -v     # deletes data volume

services:
  mongo:
    image: mongo:7
    container_name: courselit-mongo
    ports:
      - "27017:27017"
    volumes:
      - courselit-mongo-data:/data/db
    restart: unless-stopped

volumes:
  courselit-mongo-data:
